name: Build Yapp APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter Project Structure
        run: |
          flutter create . --org com.yapp.app --project-name yapp
          # نضمن بقاء كودك الخاص في مكانه الصحيح
          mkdir -p lib
        shell: bash

      - name: Get Dependencies and Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yapp-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
