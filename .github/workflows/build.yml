name: Build Yapp APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Flutter Project & Fix Files
        run: |
          flutter create --org com.yapp.app --project-name yapp my_temp_app
          cp -r my_temp_app/* .
          rm -rf my_temp_app
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yapp-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
