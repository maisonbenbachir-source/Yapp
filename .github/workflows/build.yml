
name: Build Yapp APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create . \
              --org com.yapp.app \
              --project-name yapp \
              --platforms android
          fi

      - name: Configure Pubspec
        run: |
          cat << 'EOF' > pubspec.yaml
          name: yapp
          description: "Yapp Application"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            geolocator: ^13.0.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Add Android Location Permission
        run: |
          sed -i '/<manifest /a\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' \
              android/app/src/main/AndroidManifest.xml

      - name: Insert Application Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:ui';
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const YappApp());
          }

          // ============================================================
          // APPLICATION STATE
          // ============================================================

          String appLang = 'ar';

          String selectedCountryCode = '+212';
          String myPhone = '';
          DateTime? myBirthDate;

          bool smsVerified = false;
          bool hasFace = false;
          bool ratingRewardClaimed = false;

          int likes = 10;

          String userLocationStr = 'Location not available';

          // Demo verification code.
          // For production replace this with Firebase Phone Authentication.
          const String demoSmsCode = '123456';

          // Demo-only duplicate storage.
          // This resets when the application restarts.
          final Set<String> registeredPhones = {};

          // ============================================================
          // TRANSLATIONS
          // ============================================================

          final Map<String, Map<String, String>> t = {
            'ar': {
              'app_name': 'Yapp',
              'create_account': 'إنشاء حساب',
              'country_code': 'رمز الدولة',
              'phone': 'رقم الهاتف',
              'dob': 'تاريخ الميلاد',
              'select_dob': 'اختر تاريخ الميلاد',
              'continue': 'متابعة',
              'required': 'يرجى إكمال جميع البيانات',
              'invalid_phone': 'يرجى إدخال رقم هاتف صحيح',
              'duplicate_phone': 'هذا الرقم مسجل مسبقاً',
              'underage': 'يجب أن يكون عمر المستخدم 18 عاماً أو أكثر',
              'verification': 'التحقق من الهاتف',
              'sms_hint': 'أدخل رمز SMS',
              'demo_code': 'رمز التجربة: 123456',
              'verify': 'تأكيد',
              'invalid_code': 'رمز التحقق غير صحيح',
              'location_title': 'الموقع الجغرافي',
              'location_desc': 'نستخدم موقعك لإظهار الأشخاص القريبين منك',
              'allow_location': 'السماح بالموقع',
              'continue_without_location': 'المتابعة بدون موقع',
              'face_title': 'توثيق الوجه',
              'face_desc': 'يجب إكمال التحقق قبل فتح التصفح',
              'verify_face': 'تأكيد توثيق الوجه',
              'face_success': 'تم التحقق بنجاح',
              'feed': 'التصفح',
              'locked': 'المحتوى مقفل\nأكمل التحقق أولاً',
              'rate': 'تقييم التطبيق',
              'rate_desc': 'قيّم تجربتك مع التطبيق',
              'reward': 'مكافأة +2 إعجاب',
              'reward_done': 'تم الحصول على المكافأة مسبقاً',
              'language': 'اللغة',
              'likes': 'الإعجابات',
              'age': 'العمر',
              'location': 'الموقع',
              'no_likes': 'لا توجد إعجابات متاحة',
              'thanks': 'شكراً لتقييمك!',
            },
            'en': {
              'app_name': 'Yapp',
              'create_account': 'Create Account',
              'country_code': 'Country Code',
              'phone': 'Phone Number',
              'dob': 'Date of Birth',
              'select_dob': 'Select Date of Birth',
              'continue': 'Continue',
              'required': 'Please complete all fields',
              'invalid_phone': 'Please enter a valid phone number',
              'duplicate_phone': 'This phone number is already registered',
              'underage': 'Users must be 18 years or older',
              'verification': 'Phone Verification',
              'sms_hint': 'Enter SMS code',
              'demo_code': 'Demo code: 123456',
              'verify': 'Verify',
              'invalid_code': 'Invalid verification code',
              'location_title': 'Location',
              'location_desc': 'We use your location to show nearby people',
              'allow_location': 'Allow Location',
              'continue_without_location': 'Continue Without Location',
              'face_title': 'Face Verification',
              'face_desc': 'Verification must be completed before browsing',
              'verify_face': 'Confirm Face Verification',
              'face_success': 'Verification completed successfully',
              'feed': 'Browse',
              'locked': 'Content Locked\nComplete verification first',
              'rate': 'Rate App',
              'rate_desc': 'Rate your experience with the app',
              'reward': '+2 Likes Reward',
              'reward_done': 'Reward already claimed',
              'language': 'Language',
              'likes': 'Likes',
              'age': 'Age',
              'location': 'Location',
              'no_likes': 'No likes remaining',
              'thanks': 'Thanks for your rating!',
            },
          };

          String tr(String key) {
            return t[appLang]?[key] ?? t['en']![key] ?? key;
          }

          // ============================================================
          // HELPERS
          // ============================================================

          int calculateAge(DateTime birthDate) {
            final today = DateTime.now();

            int age = today.year - birthDate.year;

            if (today.month < birthDate.month ||
                (today.month == birthDate.month &&
                    today.day < birthDate.day)) {
              age--;
            }

            return age;
          }

          void showMessage(BuildContext context, String message) {
            ScaffoldMessenger.of(context).showSnackBar(
              SnackBar(content: Text(message)),
            );
          }

          // ============================================================
          // APP
          // ============================================================

          class YappApp extends StatelessWidget {
            const YappApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Yapp',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.pink,
                  ),
                  useMaterial3: true,
                ),
                home: const AuthView(),
              );
            }
          }

          // ============================================================
          // LANGUAGE BUTTON
          // ============================================================

          class LanguageButton extends StatelessWidget {
            final VoidCallback onChanged;

            const LanguageButton({
              super.key,
              required this.onChanged,
            });

            @override
            Widget build(BuildContext context) {
              return IconButton(
                icon: const Icon(Icons.language),
                onPressed: onChanged,
              );
            }
          }

          // ============================================================
          // AUTH VIEW
          // ============================================================

          class AuthView extends StatefulWidget {
            const AuthView({super.key});

            @override
            State<AuthView> createState() => _AuthViewState();
          }

          class _AuthViewState extends State<AuthView> {
            final phoneController = TextEditingController();

            @override
            void dispose() {
              phoneController.dispose();
              super.dispose();
            }

            Future<void> selectBirthDate() async {
              final now = DateTime.now();

              final picked = await showDatePicker(
                context: context,
                initialDate: DateTime(now.year - 18),
                firstDate: DateTime(1900),
                lastDate: now,
              );

              if (picked != null) {
                setState(() {
                  myBirthDate = picked;
                });
              }
            }

            void continueRegistration() {
              final phone = phoneController.text.trim();

              if (phone.isEmpty || myBirthDate == null) {
                showMessage(context, tr('required'));
                return;
              }

              if (phone.length < 6) {
                showMessage(context, tr('invalid_phone'));
                return;
              }

              if (calculateAge(myBirthDate!) < 18) {
                showMessage(context, tr('underage'));
                return;
              }

              final fullPhone = '$selectedCountryCode$phone';

              if (registeredPhones.contains(fullPhone)) {
                showMessage(context, tr('duplicate_phone'));
                return;
              }

              registeredPhones.add(fullPhone);
              myPhone = fullPhone;

              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => const VerificationView(),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(tr('app_name')),
                  actions: [
                    LanguageButton(
                      onChanged: () {
                        setState(() {
                          appLang = appLang == 'ar' ? 'en' : 'ar';
                        });
                      },
                    ),
                  ],
                ),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: ListView(
                      children: [
                        const SizedBox(height: 30),

                        Icon(
                          Icons.favorite,
                          size: 70,
                          color: Theme.of(context).colorScheme.primary,
                        ),

                        const SizedBox(height: 20),

                        Text(
                          tr('create_account'),
                          textAlign: TextAlign.center,
                          style: const TextStyle(
                            fontSize: 24,
                            fontWeight: FontWeight.bold,
                          ),
                        ),

                        const SizedBox(height: 30),

                        DropdownButtonFormField<String>(
                          value: selectedCountryCode,
                          decoration: InputDecoration(
                            labelText: tr('country_code'),
                            border: const OutlineInputBorder(),
                          ),
                          items: const [
                            DropdownMenuItem(
                              value: '+212',
                              child: Text('🇲🇦 Morocco +212'),
                            ),
                            DropdownMenuItem(
                              value: '+33',
                              child: Text('🇫🇷 France +33'),
                            ),
                            DropdownMenuItem(
                              value: '+966',
                              child: Text('🇸🇦 Saudi Arabia +966'),
                            ),
                            DropdownMenuItem(
                              value: '+971',
                              child: Text('🇦🇪 UAE +971'),
                            ),
                          ],
                          onChanged: (value) {
                            if (value != null) {
                              setState(() {
                                selectedCountryCode = value;
                              });
                            }
                          },
                        ),

                        const SizedBox(height: 20),

                        TextField(
                          controller: phoneController,
                          keyboardType: TextInputType.phone,
                          decoration: InputDecoration(
                            labelText: tr('phone'),
                            border: const OutlineInputBorder(),
                            prefixIcon: const Icon(Icons.phone),
                          ),
                        ),

                        const SizedBox(height: 20),

                        OutlinedButton.icon(
                          onPressed: selectBirthDate,
                          icon: const Icon(Icons.calendar_today),
                          label: Text(
                            myBirthDate == null
                                ? tr('select_dob')
                                : '${myBirthDate!.year}/${myBirthDate!.month.toString().padLeft(2, '0')}/${myBirthDate!.day.toString().padLeft(2, '0')}',
                          ),
                        ),

                        const SizedBox(height: 30),

                        FilledButton(
                          onPressed: continueRegistration,
                          child: Text(tr('continue')),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          // ============================================================
          // PHONE VERIFICATION
          // ============================================================

          class VerificationView extends StatefulWidget {
            const VerificationView({super.key});

            @override
            State<VerificationView> createState() =>
                _VerificationViewState();
          }

          class _VerificationViewState extends State<VerificationView> {
            final smsController = TextEditingController();

            @override
            void dispose() {
              smsController.dispose();
              super.dispose();
            }

            void verify() {
              if (smsController.text.trim() != demoSmsCode) {
                showMessage(context, tr('invalid_code'));
                return;
              }

              smsVerified = true;

              Navigator.pushReplacement(
                context,
                MaterialPageRoute(
                  builder: (_) => const LocationPermissionView(),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(tr('verification')),
                ),
                body: Padding(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    children: [
                      const SizedBox(height: 40),

                      const Icon(
                        Icons.sms,
                        size: 70,
                      ),

                      const SizedBox(height: 20),

                      Text(
                        myPhone,
                        style: const TextStyle(
                          fontWeight: FontWeight.bold,
                        ),
                      ),

                      const SizedBox(height: 10),

                      Text(tr('demo_code')),

                      const SizedBox(height: 25),

                      TextField(
                        controller: smsController,
                        keyboardType: TextInputType.number,
                        maxLength: 6,
                        decoration: InputDecoration(
                          labelText: tr('sms_hint'),
                          border: const OutlineInputBorder(),
                        ),
                      ),

                      const SizedBox(height: 20),

                      FilledButton(
                        onPressed: verify,
                        child: Text(tr('verify')),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          // ============================================================
          // LOCATION
          // ============================================================

          class LocationPermissionView extends StatefulWidget {
            const LocationPermissionView({super.key});

            @override
            State<LocationPermissionView> createState() =>
                _LocationPermissionViewState();
          }

          class _LocationPermissionViewState
              extends State<LocationPermissionView> {
            Future<void> getLocation() async {
              try {
                final serviceEnabled =
                    await Geolocator.isLocationServiceEnabled();

                if (!serviceEnabled) {
                  userLocationStr = 'Location service disabled';
                } else {
                  LocationPermission permission =
                      await Geolocator.checkPermission();

                  if (permission == LocationPermission.denied) {
                    permission =
                        await Geolocator.requestPermission();
                  }

                  if (permission == LocationPermission.denied ||
                      permission ==
                          LocationPermission.deniedForever) {
                    userLocationStr = 'Location permission denied';
                  } else {
                    final position =
                        await Geolocator.getCurrentPosition();

                    userLocationStr =
                        'Location available 📍';
             
