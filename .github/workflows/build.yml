name: Build Yapp APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter App & Correct Pubspec
        run: |
          flutter create . --org com.yapp.app --project-name yapp --platforms android
          
          cat << 'EOF' > pubspec.yaml
          name: yapp
          description: "Yapp Matching Application"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            geolocator: ^13.0.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF
        shell: bash

      - name: Insert Full Enhanced App Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:ui';
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const YappApp());
          }

          class YappApp extends StatelessWidget {
            const YappApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Yapp',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(primarySwatch: Colors.pink),
                home: const AuthView(),
              );
            }
          }

          String appLang = 'ar';
          final Map<String, Map<String, String>> t = {
            'ar': {
              'app_name': 'Yapp',
              'login': 'إنشاء حساب وتسجيل الدخول',
              'email': 'البريد الإلكتروني (لتفعيل الإيميل)',
              'phone': 'رقم الهاتف (للتحقق عبر SMS)',
              'dob': 'تاريخ الميلاد (مثال: 1995/05/12)',
              'next_step': 'متابعة وإرسال رموز التحقق',
              'verify_title': 'رمز التحقق والتفعيل',
              'verify_sms_hint': 'أدخل كود الـ SMS المرسل لهاتفك',
              'verify_email_hint': 'أدخل كود تفعيل الإيميل المرسل',
              'verify_btn': 'تأكيد الرمز والمتابعة',
              'photo_title': 'توثيق الوجه في Yapp',
              'photo_desc': 'الرجاء رفع صورة الوجه الشخصية',
              'photo_valid': 'تم قبول صورة الوجه ✅',
              'photo_invalid': 'مرفوض: تم رصد أزهار أو حيوانات ❌',
              'btn_flower': 'تجربة رفع زهرة/حيوان',
              'btn_face': 'التقاط وجه حقيقي',
              'enter_feed': 'الدخول إلى Yapp ➔',
              'blurred_lock': 'الصور محجوبة 🔒\nيجب رفع صورتك لتتمكن من الرؤية',
              'loc_title': 'صلاحية الموقع الجغرافي',
              'loc_desc': 'نحتاج موقعك لنعرض لك الأشخاص القريبين منك بدقة',
              'loc_btn': 'السماح بالوصول للموقع',
            },
            'en': {
              'app_name': 'Yapp',
              'login': 'Sign Up & Register',
              'email': 'Email (for Email Verification)',
              'phone': 'Phone (for SMS Verification)',
              'dob': 'Date of Birth (e.g., 1995/05/12)',
              'next_step': 'Proceed & Send Codes',
              'verify_title': 'Verification Codes',
              'verify_sms_hint': 'Enter SMS code sent to phone',
              'verify_email_hint': 'Enter email activation code',
              'verify_btn': 'Verify & Continue',
              'photo_title': 'Face Verification',
              'photo_desc': 'Please upload your face photo',
              'photo_valid': 'Face Verified ✅',
              'photo_invalid': 'Rejected: Flowers/Animals ❌',
              'btn_flower': 'Test Flower/Animal',
              'btn_face': 'Capture Real Face',
              'enter_feed': 'Enter Yapp ➔',
              'blurred_lock': 'Photos Locked 🔒\nUpload your photo to view others',
              'loc_title': 'Location Access',
              'loc_desc': 'We need your location to find nearby people',
              'loc_btn': 'Allow Location Access',
            }
          };

          String myEmail = '';
          String myPhone = '';
          String myDob = '';
          bool hasFace = false;
          int likes = 10;
          String userLocationStr = 'Pending location...';

          class AuthView extends StatefulWidget {
            const AuthView({super.key});
            @override
            State<AuthView> createState() => _AuthViewState();
          }

          class _AuthViewState extends State<AuthView> {
            final eCtrl = TextEditingController();
            final pCtrl = TextEditingController();
            final dobCtrl = TextEditingController();

            void proceed() {
              if (eCtrl.text.isEmpty || pCtrl.text.isEmpty || dobCtrl.text.isEmpty) return;
              myEmail = eCtrl.text.trim();
              myPhone = pCtrl.text.trim();
              myDob = dobCtrl.text.trim();
              Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const VerificationView()));
            }

            @override
            Widget build(BuildContext context) {
              final tr = t[appLang] ?? t['en']!;
              return Scaffold(
                appBar: AppBar(title: Text(tr['app_name']!), backgroundColor: Colors.pinkAccent),
                body: Padding(
                  padding: const EdgeInsets.all(20),
                  child: ListView(
                    children: [
                      Text(tr['login']!, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 15),
                      TextField(controller: eCtrl, decoration: InputDecoration(labelText: tr['email']!)),
                      const SizedBox(height: 15),
                      TextField(controller: pCtrl, keyboardType: TextInputType.phone, decoration: InputDecoration(labelText: tr['phone']!)),
                      const SizedBox(height: 15),
                      TextField(controller: dobCtrl, decoration: InputDecoration(labelText: tr['dob']!)),
                      const SizedBox(height: 25),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.pinkAccent, foregroundColor: Colors.white),
                        onPressed: proceed,
                        child: Text(tr['next_step']!),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class VerificationView extends StatefulWidget {
            const VerificationView({super.key});
            @override
            State<VerificationView> createState() => _VerificationViewState();
          }

          class _VerificationViewState extends State<VerificationView> {
            final smsCtrl = TextEditingController();
            final emailCtrl = TextEditingController();

            void verifyCodes() {
              Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const LocationPermissionView()));
            }

            @override
            Widget build(BuildContext context) {
              final tr = t[appLang] ?? t['en']!;
              return Scaffold(
                appBar: AppBar(title: Text(tr['verify_title']!), backgroundColor: Colors.pinkAccent),
                body: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    children: [
                      TextField(controller: smsCtrl, decoration: InputDecoration(labelText: tr['verify_sms_hint']!)),
                      const SizedBox(height: 15),
                      TextField(controller: emailCtrl, decoration: InputDecoration(labelText: tr['verify_email_hint']!)),
                      const SizedBox(height: 25),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.pinkAccent, foregroundColor: Colors.white),
                        onPressed: verifyCodes,
                        child: Text(tr['verify_btn']!),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class LocationPermissionView extends StatefulWidget {
            const LocationPermissionView({super.key});
            @override
            State<LocationPermissionView> createState() => _LocationPermissionViewState();
          }

          class _LocationPermissionViewState extends State<LocationPermissionView> {
            Future<void> askLocation() async {
              bool serviceEnabled = await Geolocator.isLocationServiceEnabled();
              if (serviceEnabled) {
                LocationPermission permission = await Geolocator.checkPermission();
                if (permission == LocationPermission.denied) {
                  permission = await Geolocator.requestPermission();
                }
                if (permission != LocationPermission.denied) {
                  Position position = await Geolocator.getCurrentPosition();
                  userLocationStr = 'Lat: ${position.latitude.toStringAsFixed(2)}, Lng: ${position.longitude.toStringAsFixed(2)} 📍';
                }
              }

              if (!mounted) return;
              Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const PhotoView()));
            }

            @override
            Widget build(BuildContext context) {
              final tr = t[appLang] ?? t['en']!;
              return Scaffold(
                appBar: AppBar(title: Text(tr['loc_title']!), backgroundColor: Colors.pinkAccent),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24.0),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.location_on, size: 80, color: Colors.pinkAccent),
                        const SizedBox(height: 20),
                        Text(tr['loc_desc']!, textAlign: TextAlign.center, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 30),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.pinkAccent, foregroundColor: Colors.white),
                          onPressed: askLocation,
                          child: Text(tr['loc_btn']!),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class PhotoView extends StatefulWidget {
            const PhotoView({super.key});
            @override
            State<PhotoView> createState() => _PhotoViewState();
          }

          class _PhotoViewState extends State<PhotoView> {
            String? resultText;
            void testPic(bool isHuman) {
              final tr = t[appLang] ?? t['en']!;
              setState(() {
                hasFace = isHuman;
                resultText = isHuman ? tr['photo_valid']! : tr['photo_invalid']!;
              });
            }

            @override
            Widget build(BuildContext context) {
              final tr = t[appLang] ?? t['en']!;
              return Scaffold(
                appBar: AppBar(title: Text(tr['photo_title']!), backgroundColor: Colors.pinkAccent),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Text(resultText ?? tr['photo_desc']!, style: const TextStyle(fontWeight: FontWeight.bold)),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ElevatedButton(onPressed: () => testPic(false), child: Text(tr['btn_flower']!)),
                          const SizedBox(width: 10),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.pinkAccent, foregroundColor: Colors.white),
                            onPressed: () => testPic(true),
                            child: Text(tr['btn_face']!),
                          ),
                        ],
                      ),
                      const SizedBox(height: 20),
                      TextButton(onPressed: () => Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const FeedView())), child: Text(tr['enter_feed']!))
                    ],
                  ),
                ),
              );
            }
          }

          class FeedView extends StatefulWidget {
            const FeedView({super.key});
            @override
            State<FeedView> createState() => _FeedViewState();
          }

          class _FeedViewState extends State<FeedView> {
            final users = ['Sara, 24 (Nearby)', 'Karim, 27 (Nearby)', 'Yasmine, 22 (Nearby)'];
            int uIdx = 0;

            void tryLike() {
              setState(() {
                likes--;
                uIdx = (uIdx + 1) % users.length;
              });
            }

            @override
            Widget build(BuildContext context) {
              final tr = t[appLang] ?? t['en']!;
              return Scaffold(
                appBar: AppBar(title: Text('${tr['app_name']!} | ❤️ $likes | DOB: $myDob'), backgroundColor: Colors.pinkAccent),
                body: Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(8.0),
                      child: Text(userLocationStr, style: const TextStyle(fontSize: 12, color: Colors.grey, fontWeight: FontWeight.bold)),
                    ),
                    Expanded(
                      child: Center(
                        child: Stack(
                          alignment: Alignment.center,
                          children: [
                            Container(
                              width: 285,
                              padding: const EdgeInsets.all(20),
                              decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(15)),
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  const Icon(Icons.account_circle, size: 75, color: Colors.pinkAccent),
                                  Text(users[uIdx], style: const TextStyle(fontSize: 19, fontWeight: FontWeight.bold)),
                                  Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                                    children: [
                                      IconButton(icon: const Icon(Icons.close, color: Colors.red), onPressed: () => setState(() => uIdx = (uIdx + 1) % users.length)),
                                      IconButton(icon: const Icon(Icons.favorite, color: Colors.green), onPressed: tryLike),
                                    ],
                                  )
                                ],
                              ),
                            ),
                            if (!hasFace)
                              ClipRRect(
                                borderRadius: BorderRadius.circular(15),
                                child: BackdropFilter(
                                  filter: ImageFilter.blur(sigmaX: 8, sigmaY: 8),
                                  child: Container(
                                    width: 285,
                                    height: 200,
                                    color: Colors.black.withOpacity(0.55),
                                    child: Center(
                                      child: Text(tr['blurred_lock']!, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                                    ),
                                  ),
                                ),
                              ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF
        shell: bash

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yapp-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
